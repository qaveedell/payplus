name: Deploy to GCS

on:
  push:
    branches: [main]

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Deploy via SSH
        uses: appleboy/ssh-action@v1
        with:
          host: ${{ secrets.GCS_HOST }}
          username: ${{ secrets.GCS_USER }}
          key: ${{ secrets.GCS_SSH_KEY }}
          script: |
            set -e
            cd /opt/payplus
            git pull origin main
            docker compose build
            docker compose up -d
            echo "Deployed at $(date)"
